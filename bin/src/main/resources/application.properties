server.port=8080

# ---- PostgreSQL (override with env vars) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/speechdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Create tables from src/main/resources/schema.sql
spring.sql.init.mode=always

# ---- Self-hosted Whisper service ----
whisper.url=${WHISPER_URL:http://localhost:9000}
# Mixed Hindi/English sample text nudges Whisper towards Hinglish output
whisper.initial-prompt=Hinglish conversation: मैं आज office जा रहा हूँ, meeting है. Hello, कैसे हैं आप?

# ---- Streaming / chunking ----
stt.min-chunk-ms=2500
stt.max-chunk-ms=10000
stt.silence-ms=500
stt.silence-rms=0.01
