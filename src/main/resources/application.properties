server.port=8080

# ---- MySQL (override with env vars) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/speechdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=tiger
# Create tables from src/main/resources/schema.sql
spring.sql.init.mode=always


# ---- Self-hosted Whisper service ----
whisper.url=${WHISPER_URL:http://localhost:9000}
# Mixed Hindi/English sample text nudges Whisper towards Hinglish output
whisper.initial-prompt=Hinglish conversation: \u092e\u0948\u0902 \u0906\u091c office \u091c\u093e \u0930\u0939\u093e \u0939\u0942\u0901, meeting \u0939\u0948. Hello, \u0915\u0948\u0938\u0947 \u0939\u0948\u0902 \u0906\u092a?

# ---- Streaming / chunking ----
stt.min-chunk-ms=2500
stt.max-chunk-ms=10000
stt.silence-ms=500
stt.silence-rms=0.01